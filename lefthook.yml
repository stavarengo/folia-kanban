# Git hooks are convenience only and stay fast. CI runs `pnpm verify` on every
# push to main and gates releases — hooks can be bypassed, CI cannot.
pre-commit:
  parallel: true
  commands:
    lint-and-format:
      glob: "*.{ts,tsx}"
      run: pnpm eslint {staged_files} && pnpm prettier --write {staged_files}
      stage_fixed: true
    format-data:
      glob: "*.{json,jsonc,mjs,cjs,yml,yaml}"
      run: pnpm prettier --write {staged_files}
      stage_fixed: true
    lint-docs:
      glob: "*.md"
      run: pnpm markdownlint-cli2 {staged_files}
      stage_fixed: true
    # ls-lint checks only the paths it is given, and a file path does not
    # cover the directories above it, so pass those too.
    lint-filenames:
      run: |
        for f in {staged_files}; do
          while [ "$f" != . ]; do printf '%s\0' "$f"; f=$(dirname "$f"); done
        done | sort -zu | xargs -0 pnpm ls-lint

pre-push:
  commands:
    typecheck:
      run: pnpm typecheck
