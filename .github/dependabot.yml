version: 2

# Two ecosystems, for two different reasons — the workflow actions below, and
# pnpm-lock.yaml after them.
#
# The actions in pipeline.yml are pinned to commit SHAs, which is what stops a
# compromised tag from moving under us — and what would otherwise freeze them
# forever, security fixes included. This is the other half: Dependabot proposes
# the new SHA as a pull request.
#
# No manual step goes with one. The repository's Actions allow-list names whole
# actions rather than pins — four wildcard patterns, alongside the GitHub-owned
# and Marketplace-verified allowances — so a new SHA is admitted the moment the
# pull request opens. Only the tighter list docs/releasing.md offers as an
# option would cost a settings edit per bump, and that is not what is
# configured.
#
# `obsidianmd/obsidian-workflows@v1` floats on purpose and is not pinned, so
# there is no SHA under it to move; only a `v2` would ever show up here.
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    # None of these can release, so a week of them is worth one review rather
    # than one each. Majors stay in the group, unlike the npm one below: these
    # are a handful of actions, not a tree, so little queues behind one that
    # needs work.
    groups:
      actions:
        patterns:
          - "*"
    # A compromised release is usually pulled within days, so let one age before
    # we are asked to take it; security updates bypass this.
    cooldown:
      default-days: 7

  # pnpm-lock.yaml, which no workflow fails over: the pull-request OSV scan only
  # blocks a vulnerability the change itself introduces, and the release job only
  # blocks one in what the bundle ships. Alerts watch the graph without this
  # entry; what this entry adds is the pull request that acts on one — the weekly
  # version update, and the shape a security update takes, the switch for those
  # being a repository setting this file cannot carry. See docs/releasing.md.
  #
  # Two prefixes, because the plan job only counts `feat` and `fix` as releasable.
  # A runtime dependency is bundled into main.js, so bumping one changes what
  # people are running and should be able to cut a release on its own; a dev
  # dependency changes nothing they install, and `chore` leaves main at "nothing
  # to release" until something else earns one. `include: scope` is what keeps
  # the runtime half readable: a bump lands as `fix(deps): …`, so the Bug Fixes
  # section says which entries were dependencies and which were somebody fixing
  # something. The plan job's grammar accepts a scope, so it stays releasable.
  # `chore(deps-dev)` is hidden from the changelog either way; there the scope
  # only helps whoever is reading the log.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    # The dev tooling is most of the tree and none of it can release, so its
    # routine bumps arrive as one pull request a week rather than thirty-odd; a
    # runtime bump is a `fix` somebody may want to release on its own and stays
    # separate. Majors are left out of the group so one that needs work cannot
    # hold nineteen green ones behind it. The cost is that a family which only
    # goes green together — eslint with its plugins, the testing-library pair —
    # arrives as one pull request each; Dependabot already bundles packages it
    # can see must move in lockstep, and the rest is a manual merge.
    groups:
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
        patterns:
          - "*"
    # A compromised release is usually pulled within days, so let one age before
    # we are asked to take it; security updates bypass this.
    cooldown:
      default-days: 7
    # `obsidian` is typings, and the version installed here decides which APIs
    # typecheck — a judgement to make beside manifest.json's minAppVersion, not
    # a bump to take on a Monday. Note it is not aligned today: the range is
    # `^1.7.2`, it resolves ahead of the 1.11.4 floor, and this entry holds that
    # where it is rather than fixing it (docs/ai/backlog/20260913.01). It
    # silences security updates for the package too, which nothing ships.
    ignore:
      - dependency-name: obsidian
