# Scans the whole dependency tree on every push to main (fast feedback on a
# freshly landed lockfile) and monthly (new advisories against unchanged deps).
name: OSV-Scanner Main & Scheduled Scan

on:
  schedule:
    - cron: "30 12 1 * *" # At 12:30 on day-of-month 1
  push:
    branches: [main]

permissions:
  actions: read
  security-events: write
  contents: read

jobs:
  # The code-scanning analysis key is derived from this file's path, so
  # renaming the file would orphan the alerts already filed under it.
  scan-scheduled:
    name: Scan main
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.5.1"
