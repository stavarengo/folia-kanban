name: CI

# CI is the final authority (blueprint §31): every main-branch change must pass
# the same `pnpm verify` an agent runs locally.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm verify

  # Obsidian's own action, running the community directory's real scanner rulesets
  # with the tool versions the directory pins — which the local reproduction in
  # `pnpm verify` (`obsidian-scan:check`) cannot, since it shares this repo's ESLint
  # major and its own caniuse data. Floating on `v1` on purpose, so it tracks the
  # scanner rather than a snapshot of it.
  #
  # NOT a gate on lint findings, and cannot be made into one: the action reports
  # every scanner finding as a warning and only calls setFailed on `error` severity
  # (manifest/README/license schema, or a failed build), and stylelint exits 0 on its
  # own warnings so those reach the log but not even an annotation. There is no
  # strictness input. So this job failing means the manifest or the build broke; the
  # gate on lint findings is `obsidian-scan:check`, which fails on any of them.
  # Read this job's log when the two should agree and you want to know if the
  # scanner has moved — findings here that the local pass missed mean it has.
  obsidian-scan:
    name: Obsidian community scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      # The action is npm-only (`npm ci`/`npm install`), and this repo has no
      # package-lock.json. Installing first makes it skip its own install — it
      # bails out when node_modules exists — so its type-aware ESLint pass sees
      # the pnpm-pinned tree, not a freshly resolved one. The two lint passes
      # install their own pinned tools in a temp dir either way.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Scan
        uses: obsidianmd/obsidian-workflows@v1
        with:
          type: plugin
          mode: pr
          # Off by default outside release mode; without it this only reruns our
          # own `pnpm lint`, not the scanner's rulesets.
          scanner-lint: true
          # The verify job already builds. Building here would only add a second
          # copy of styles.css under dist/ for stylelint to report twice — its
          # ignoreFiles is inert the way the action invokes it.
          build: "false"
