# Diffs the pull request against its base so only newly introduced
# vulnerabilities fail the check.
name: OSV-Scanner PR Scan

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  security-events: write
  contents: read

jobs:
  scan-pr:
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@v2.5.1"
