name: Pipeline

# One workflow, two shapes of run.
#
# A push or pull-request run verifies, scans and — on main — plans: it says in
# the run summary which version the next release would carry and which commits
# it would carry, then ends. It never releases, so it never waits for anyone and
# never leaves a run parked.
#
# A release is a `workflow_dispatch` with an empty `tag` input, normally started
# by `pnpm dev:helpers:release`, which prints the same plan locally and asks for
# confirmation first. Dispatching is the approval; there is no second gate. That
# run verifies, scans and plans the tip of main again and then releases it, so
# what gets published is the commit that passed `pnpm verify` in this same run,
# with release-it's version bump committed on top of it — nothing is inferred
# from a green tick on another workflow, and no run hands its release to
# another. (With the optional release App configured, the release commit does
# start one more push run, which verifies and stops at "nothing to release";
# see the token step.) A dispatch with a `tag` input is the republish path,
# described on the release job.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Republish an existing tag (leave empty to release from main)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # Pull-request runs share a group per branch and supersede each other, since
  # only the latest commit matters. Every other run gets a group of its own, so
  # nothing queues behind anything. A shared group per ref would be shorter and
  # is wrong for the two runs that matter: GitHub keeps only one pending run per
  # group, so a third arrival drops the second, and the run that would be
  # dropped is a dispatched release or republish someone just asked for — while
  # a push run it queues behind buys nothing, since a push run no longer
  # releases. The release itself is serialised by the release job's own group.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify
    # A republish dispatch publishes a tag that was already verified when it was
    # cut. The state of main is not what it is about, and a red main must not
    # block the recovery path.
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.tag == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm verify

      # `pnpm verify` builds. Keeping that build lets anyone inspect what this
      # commit produces; the release job still rebuilds, because the bump
      # changes manifest.json after this job has run.
      - name: Upload the built plugin
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Obsidian's own action, running the community directory's real scanner rulesets
  # with the tool versions the directory pins — which the local reproduction in
  # `pnpm verify` (`obsidian-scan:check`) cannot, since it shares this repo's ESLint
  # major and its own caniuse data. Floating on `v1` on purpose, so it tracks the
  # scanner rather than a snapshot of it.
  #
  # NOT a gate on lint findings, and cannot be made into one: the action reports
  # every scanner finding as a warning and only calls setFailed on `error` severity,
  # and stylelint exits 0 on its own warnings so those reach the log but not even an
  # annotation. There is no strictness input. What is left at `error` severity here,
  # with the build switched off below: manifest/versions.json schema, a missing
  # README or LICENSE, and a failed install of the scanner's own temp deps (a network
  # flake — rerun it). The gate on lint findings is `obsidian-scan:check`, which
  # fails on any of them.
  # Read this job's log when the two should agree and you want to know if the
  # scanner has moved — findings here that the local pass missed mean it has.
  scan:
    name: Obsidian community scan
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.tag == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      # The action is npm-only (`npm ci`/`npm install`), and this repo has no
      # package-lock.json. Installing first makes it skip its own install — it
      # bails out when node_modules exists — so its type-aware ESLint pass sees
      # the pnpm-pinned tree, not a freshly resolved one. The two lint passes
      # install their own pinned tools in a temp dir either way.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Scan
        uses: obsidianmd/obsidian-workflows@v1
        with:
          type: plugin
          mode: pr
          # Off by default outside release mode; without it this only reruns our
          # own `pnpm lint`, not the scanner's rulesets.
          scanner-lint: true
          # The verify job already builds. Building here would only add a second
          # copy of styles.css under dist/ for stylelint to report twice — its
          # ignoreFiles is inert the way the action invokes it.
          build: "false"

  # Also the review surface: this job's summary is what a person (or the local
  # dispatch script, which computes the same thing from origin/main) reads to
  # decide whether to release. On a push run that is all it is; on a dispatched
  # release run the decision has already been made and this is the record of
  # what was decided on.
  plan:
    name: Plan the release
    needs: [verify, scan]
    if: ${{ github.ref == 'refs/heads/main' && !(github.event_name == 'workflow_dispatch' && inputs.tag != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      version: ${{ steps.plan.outputs.version }}
      releasable: ${{ steps.plan.outputs.releasable }}

    steps:
      # Full history and tags: both halves of the plan read the commits since
      # the last tag.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Decide whether there is a release, and which version
        id: plan
        shell: bash
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          # semver.org's grammar, prerelease identifiers included: an empty or
          # zero-padded identifier is not a version, and a tag that is not a
          # version is a release Obsidian will not match. The same expression
          # lives in scripts/bump-plugin-version.mjs and the release job below.
          part='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          SEMVER="^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-${part}(\.${part})*)?$"

          # `--exclude '*-*'` matches .release-it.json's tagExclude, so this and
          # release-it agree on where the last release was; the assertion after
          # it refuses to guess if some other dotted tag has landed in between,
          # which would silently narrow the range the scan below reads.
          previous=$(git describe --tags --abbrev=0 --match '*.*.*' --exclude '*-*' 2>/dev/null || true)
          if [ -n "$previous" ] && [[ ! "$previous" =~ $SEMVER ]]; then
            echo "::error::The nearest tag, '$previous', is not a plain semver release tag, so where the last release ended cannot be established."
            exit 1
          fi

          # One revision for the range and for the link, so the summary cannot
          # describe one commit and link another.
          sha=$(git rev-parse HEAD)
          if [ -n "$previous" ]; then
            range="$previous..$sha"
            since="$previous"
            link="$REPO_URL/compare/$previous...$sha"
            link_text="Compare $previous...${sha:0:7}"
          else
            range="$sha"
            since="the first commit"
            # No previous release to compare against, so link the commits
            # themselves — the same list, on GitHub.
            link="$REPO_URL/commits/$sha"
            link_text="Commits up to ${sha:0:7}"
          fi

          # release-it cannot answer "is there anything to release": the
          # conventionalcommits preset's whatBump floors at patch for any commit
          # at all, so `--release-version` prints a number even for a
          # docs-only batch. The commits answer that question here; the version
          # itself still comes from release-it, so preMajor and the preset stay
          # in one place.
          subjects=$(git log --format=%s "$range")
          bodies=$(git log --format=%B "$range")
          releasable=false
          if grep -qE '^(feat|fix)(\([^)]*\))?!?:' <<<"$subjects" \
            || grep -qE '^[a-zA-Z]+(\([^)]*\))?!:' <<<"$subjects" \
            || grep -qE '^BREAKING[ -]CHANGE:' <<<"$bodies"; then
            releasable=true
          fi

          version=""
          if [ "$releasable" = true ]; then
            # Prints the next version and writes nothing. It still enforces
            # .release-it.json's git requirements, which is why this job runs on
            # a checkout of main rather than a detached commit.
            version=$(pnpm exec release-it --release-version --ci | tail -n 1)
            if [[ ! "$version" =~ $SEMVER ]]; then
              echo "::error::release-it answered '$version', which is not a plain semver version."
              exit 1
            fi
            headline="**Next version: $version**"
          else
            headline="**Nothing to release:** no feat, fix or breaking-change commit since $since."
          fi

          # The review surface. The commit list is written in both cases, since
          # it is also what explains a "nothing to release" verdict, and it is
          # piped straight from git rather than echoed from a variable, so
          # backslashes in a subject survive.
          {
            echo "## Release plan"
            echo
            echo "$headline"
            echo
            echo "### Commits since $since"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          git log --format='- %s (`%h`)' "$range" >> "$GITHUB_STEP_SUMMARY"
          {
            echo
            echo "[$link_text]($link)"
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo "releasable=$releasable"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

  release:
    name: Release
    needs: [verify, scan, plan]
    # Only a dispatch ever reaches this job: the dispatch is the decision to
    # release, so a push run stops at plan however releasable it is. Two ways in
    # from there. The republish path skips verify, scan and plan, so their
    # results are not part of its condition; the normal path requires all three.
    # `!cancelled()` rather than `always()`: a cancelled run must not release.
    if: >-
      ${{ !cancelled()
      && github.event_name == 'workflow_dispatch'
      && (inputs.tag != ''
      || (needs.verify.result == 'success'
      && needs.scan.result == 'success'
      && needs.plan.outputs.releasable == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # One ordinary release at a time, and one republish per tag at a time, in
    # separate groups. A group holds one running job and one pending job, and a
    # third arrival drops the pending one; for an ordinary release that costs
    # nothing but the dispatch, since nothing in the repository has changed yet
    # and the commits are still there, while a dropped republish would lose a
    # deliberate recovery, so a republish only ever queues behind another
    # attempt at its own tag.
    #
    # The two groups are not serialised against each other, so do not dispatch a
    # republish of a version while that version is being cut — the only way to
    # have two jobs on one release, and the only way to reopen the window the
    # draft-first sequence below closes.
    concurrency:
      group: release-${{ github.repository }}-${{ inputs.tag && format('tag-{0}', inputs.tag) || 'main' }}
      cancel-in-progress: false

    permissions:
      contents: write
      id-token: write
      attestations: write

    # A step's `if` cannot read the `secrets` context, so whether the release
    # App is configured is carried in as a job-level boolean. Only the answer,
    # never the credentials: those are handed to the minting step and nowhere
    # else, so no other step — and nothing a package lifecycle script runs — has
    # the App's private key in its environment.
    env:
      HAS_RELEASE_APP: ${{ secrets.RELEASE_APP_ID != '' && secrets.RELEASE_APP_PRIVATE_KEY != '' }}

    outputs:
      version: ${{ steps.resolve.outputs.tag }}
      url: ${{ steps.publish.outputs.url }}

    steps:
      # Before the checkout, because the checkout is handed this value: a
      # malformed input should be refused by name, not turn into a "ref not
      # found" from an action that never got to say what was wrong.
      - name: Validate the republish input
        if: ${{ inputs.tag != '' }}
        shell: bash
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          # Plain semver only (no "v" prefix) — matches manifest.version and the
          # release-it tag contract. Same grammar as the plan job and
          # scripts/bump-plugin-version.mjs.
          part='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          SEMVER="^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-${part}(\.${part})*)?$"
          if [[ ! "$TAG_INPUT" =~ $SEMVER ]]; then
            echo "::error::'$TAG_INPUT' is not a plain semver release tag (e.g. 1.2.3)."
            exit 1
          fi

      # main, not github.sha: .release-it.json requires the branch and its
      # upstream, and a detached HEAD has neither. The guard below turns that
      # into the "did main move while this run was working" check — a dispatch
      # still takes minutes to reach here, and someone can push in them. The
      # republish ref
      # is spelled out in full, so a branch that happens to share the tag's name
      # cannot be checked out in its place.
      #
      # Still no persisted credentials, even though this is the job that pushes.
      # The push token is injected in the release step alone, so it is not in
      # .git/config while package lifecycle scripts run during install.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || 'main' }}
          fetch-depth: 0
          persist-credentials: false

      - name: Guard the commit being released
        shell: bash
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          git fetch --no-tags origin main

          if [ -n "$TAG_INPUT" ]; then
            # Only republish tags whose commit is on main, so a stray tag on an
            # unmerged or forked commit cannot reach the directory.
            if ! git merge-base --is-ancestor "refs/tags/$TAG_INPUT^{commit}" FETCH_HEAD; then
              echo "::error::Tag '$TAG_INPUT' is not reachable from origin/main; refusing to republish."
              exit 1
            fi
            # ...and only the commit that tag names: everything below is built
            # from the working tree, so the tree has to be that commit.
            if [ "$(git rev-parse HEAD)" != "$(git rev-parse "refs/tags/$TAG_INPUT^{commit}")" ]; then
              echo "::error::The checkout is not the commit tag '$TAG_INPUT' points at; refusing to republish."
              exit 1
            fi
            echo "Republishing the existing tag $TAG_INPUT."
          else
            head=$(git rev-parse HEAD)
            remote=$(git rev-parse FETCH_HEAD)
            if [ "$head" != "$GITHUB_SHA" ] || [ "$remote" != "$GITHUB_SHA" ]; then
              echo "::error::main moved on after this run started. This run verified $GITHUB_SHA, origin/main is now $remote. Nothing has been changed; start a new run on the new main — this pipeline never rebases and never releases a commit it did not verify."
              exit 1
            fi
            echo "Releasing $GITHUB_SHA, still the tip of origin/main."
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Optional, and only for the push below. A tag ruleset that restricts
      # creations applies to GITHUB_TOKEN as well, and the built-in GitHub
      # Actions identity cannot be put on a ruleset's bypass list — a GitHub App
      # can, so the ruleset and this pipeline can only coexist through one. With
      # both secrets set, release-it pushes as that App; with either missing,
      # nothing changes and the push is GITHUB_TOKEN's. See docs/releasing.md.
      - name: Mint the release App's token
        id: app-token
        if: ${{ env.HAS_RELEASE_APP == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.tag != '') }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Bump, write the changelog, commit, tag and push
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.tag != '') }}
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          # The App's token when there is one, GITHUB_TOKEN otherwise: the
          # minting step above is skipped without the secrets, and a skipped
          # step's output is empty.
          PUSH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          # Inject the push token only here, and take it out again on the way
          # out, so it is in .git/config for this step and no other — not while
          # package lifecycle scripts run during install, and not while the
          # build that follows runs repository code.
          #
          # A GITHUB_TOKEN push starts no workflow, which is what lets this run
          # own the whole release instead of handing it to a second one. An App
          # token is an ordinary actor and its push does start one: the release
          # commit sets off another push run of this pipeline, which verifies,
          # scans, plans and stops at "nothing to release", because `chore` is
          # not releasable. The tag push starts nothing either way — this
          # workflow has no tag trigger.
          #
          # What this does not do, and no arrangement inside one job can: the
          # job's own contents:write token exists for the whole job, and any
          # action it runs can read it without being handed it. The boundary
          # here is the configured git credential, not the token itself.
          trap 'git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"' EXIT
          git remote set-url origin "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The version the plan job published in this run's summary, handed
          # back to release-it, so what was reviewed is what is cut: release-it
          # works the increment out again otherwise, and a tag appearing while
          # this run was building would move the answer.
          pnpm ci:release --increment "$VERSION"

      - name: Resolve the released version
        id: resolve
        shell: bash
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          if [ -n "$TAG_INPUT" ]; then
            tag="$TAG_INPUT"
          else
            # release-it wrote this version into package.json and manifest.json
            # and tagged the commit with the same string.
            tag=$(node -p "require('./package.json').version")
          fi

          # Obsidian matches a release to a plugin by the version string in the
          # manifest, so a tag that disagrees with it is a listing that never
          # updates. On the ordinary path release-it writes both from one value;
          # on the republish path this is what stops an arbitrary
          # semver-shaped tag, sitting on any commit reachable from main, from
          # being published as if it were a release.
          manifest=$(node -p "require('./manifest.json').version")
          if [ "$manifest" != "$tag" ]; then
            echo "::error::manifest.json says $manifest but the release tag is $tag. Refusing to publish a release Obsidian cannot match."
            exit 1
          fi

          case "$tag" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac

          {
            echo "tag=$tag"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      # The bump rewrote manifest.json, so the dist/ the verify job built is one
      # version behind. What gets attested and uploaded is built here, from the
      # commit the tag points at.
      - name: Build the plugin
        run: pnpm build

      # The subject digests are this build's. The source revision recorded
      # beside them is the run's own GITHUB_SHA, which the action reads from the
      # event and no input can override: the commit that triggered the run, one
      # parent below the release commit release-it just made (and, on the
      # republish path, the tip of main at dispatch time rather than the tag).
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/main.js
            dist/styles.css
            dist/manifest.json

      - name: Extract the release notes from the changelog
        id: notes
        shell: bash
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          # release-it writes one CHANGELOG.md section per tag from the
          # Conventional Commits since the previous tag. Take that section's
          # body (heading excluded, the release title already carries the tag).
          # --generate-notes is not usable here: it summarises merged pull
          # requests, and this repository lands commits straight on main.
          notes="$RUNNER_TEMP/release-notes.md"
          : > "$notes"

          if [ -f CHANGELOG.md ]; then
            awk -v tag="$TAG" '
              /^#+ / {
                match($0, /^#+/)
                level = RLENGTH
                if (found) {
                  # A heading at the version level (or above) ends the section;
                  # deeper ones are its own "### Features"-style subsections.
                  if (level <= found) { exit }
                  print
                  next
                }
                line = $0
                gsub(/[][()<>\/]/, " ", line)
                n = split(line, field, / +/)
                for (i = 1; i <= n; i++) {
                  if (field[i] == tag) { found = level; break }
                }
                next
              }
              found { print }
            ' CHANGELOG.md > "$notes"
          fi

          if [ -s "$notes" ] && grep -q '[^[:space:]]' "$notes"; then
            echo "file=$notes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No CHANGELOG.md section for $TAG; releasing without notes."
            echo "file=" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or reuse the GitHub release
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
          PRERELEASE: ${{ steps.resolve.outputs.prerelease }}
          NOTES: ${{ steps.notes.outputs.file }}
        run: |
          # Created as a draft, published in the last step once all three assets
          # are on it: a release the directory can see with a file missing is
          # worse than one that appears a minute later. Reusing an existing
          # release is what makes the republish path a recovery rather than a
          # second attempt at the same create.
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Back to a draft while its assets are replaced. --clobber swaps
            # three files one at a time, so a release left public through that
            # is a release someone can read with a new main.js beside an old
            # manifest.json — and if one upload fails, it stays that way.
            echo "Reusing the existing GitHub release for $TAG."
            gh release edit "$TAG" --draft=true
          else
            args=("$TAG" --title "$TAG" --draft)

            if [ -n "$NOTES" ]; then
              args+=(--notes-file "$NOTES")
            else
              args+=(--notes "")
            fi

            if [ "$PRERELEASE" = true ]; then
              args+=(--prerelease)
            fi

            gh release create "${args[@]}"
          fi

          url=$(gh release view "$TAG" --json url --jq .url)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Upload the Obsidian plugin assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: gh release upload "$TAG" dist/main.js dist/manifest.json dist/styles.css --clobber

      # Only now is the release worth looking at. This also repairs a release
      # left as a draft, or flagged the wrong way, by a run that died between
      # the two steps above — which is the case the republish path exists for.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
          URL: ${{ steps.publish.outputs.url }}
          PRERELEASE: ${{ steps.resolve.outputs.prerelease }}
        run: |
          gh release edit "$TAG" --draft=false --prerelease="$PRERELEASE"
          # The summary says "released" here and nowhere earlier, so it cannot
          # claim a release that a failed upload left as a draft.
          echo "Released [$TAG]($URL)" >> "$GITHUB_STEP_SUMMARY"

  announce:
    name: Announce
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # The community portal has no public or unauthenticated trigger; this is
      # the maintainer's own account-page request, replayed with a stored session
      # cookie. It is a nudge, not a gate: the listing also picks the release up
      # on its own within about a day, so nothing here fails the run.
      - name: Ask the community portal to re-check the release
        id: portal
        shell: bash
        env:
          PORTAL_COOKIE: ${{ secrets.OBSIDIAN_PORTAL_COOKIE }}
        run: |
          if [ -z "${PORTAL_COOKIE:-}" ]; then
            answer="skipped, no OBSIDIAN_PORTAL_COOKIE secret is set"
          else
            body="$RUNNER_TEMP/portal-response"
            status=$(curl --silent --location --output "$body" --write-out '%{http_code}' \
              --connect-timeout 10 --max-time 60 \
              --header "Cookie: $PORTAL_COOKIE" \
              https://community.obsidian.md/account/plugins/folia-kanban/check-release) || status="000"

            # Only ever classify the response. It is an authenticated account
            # page, so its body never reaches the log or the message below.
            if grep -qi 'refreshed in the last few minutes' "$body"; then
              answer="in cooldown, the portal refreshed this entry a few minutes ago"
            elif grep -qi 'name="password"' "$body"; then
              answer="the stored cookie has expired, the portal answered with its login page"
            elif [ "$status" = "200" ]; then
              answer="asked, the portal accepted the re-check"
            elif [ "$status" = "401" ] || [ "$status" = "403" ]; then
              answer="the stored cookie was rejected (HTTP $status), refresh OBSIDIAN_PORTAL_COOKIE"
            elif [ "$status" = "000" ]; then
              answer="the portal could not be reached"
            else
              answer="unexpected portal answer (HTTP $status)"
            fi
          fi

          echo "Portal: $answer"
          echo "answer=$answer" >> "$GITHUB_OUTPUT"

      - name: Send the Telegram message
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VERSION: ${{ needs.release.outputs.version }}
          URL: ${{ needs.release.outputs.url }}
          PORTAL: ${{ steps.portal.outputs.answer }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "Skipped: TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is not set."
            exit 0
          fi

          text=$(printf 'folia-kanban %s is released.\n%s\nCommunity portal: %s' "$VERSION" "$URL" "$PORTAL")

          if ! curl --silent --fail --output /dev/null --request POST \
            --connect-timeout 10 --max-time 30 \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=$text"; then
            echo "::warning::The Telegram notification failed; the release itself is published."
          fi
